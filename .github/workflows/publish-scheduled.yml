name: Publish scheduled articles

on:
  schedule:
    - cron: '17 12 * * *'   # daily, ~7:17 AM Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pub
        run: python .github/scripts/publish_scheduled.py
      - if: steps.pub.outputs.count != '0'
        run: |
          git config user.name "CheckOff Books Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A resources scheduled vercel.json sitemap.xml
          git commit -m "Publish scheduled articles"
          git push
